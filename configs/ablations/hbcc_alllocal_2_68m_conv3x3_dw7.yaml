# As hbcc_alllocal_2_68m_dw7.yaml with the stage-1 LBPConv replaced by a learned 3x3 convolution.
# At 1.62M the two were a statistical tie in accuracy (+0.10 val, p=0.63, seed 42) while the 3x3
# cut peak batch-128 memory 2.51x (796.9 -> 316.9 MB) and raised throughput 1.43x. This checks
# whether the tie survives at 2.7M. Params: 2,708,196 - 780 = 2,707,416 (stage-1 C=78, delta=C(88-C)).
experiment:
  name: hbcc_alllocal_2_68m_conv3x3_dw7
data:
  name: cifar10
  root: data
  download: true
  batch_size: 128
  val_batch_size: 256
  test_batch_size: 256
  val_size: 5000
  split_seed: 42
  workers: 2
  augment: true
  randaugment:
    enabled: true
    num_ops: 2
    magnitude: 9
  random_erasing:
    p: 0.25
    scale: [0.02, 0.2]
    ratio: [0.3, 3.3]
model:
  name: hbcc
  num_classes: 10
  use_coord: true
  embed_dims: [78, 116, 232, 310]
  depths: [1, 1, 2, 1]
  mlp_ratios: 3.0
  heads: [2, 3, 4, 4]
  head_dim: [16, 16, 16, 16]
  proposals: [[2, 2], [2, 2], [2, 2], [1, 1]]
  folds: [[4, 4], [2, 2], [1, 1], [1, 1]]
  similarities: [cosine, cosine, cosine, cosine]
  stage_modes: [local, local, local, local]
  local_branches: [conv3x3, dwconv7, dwconv7, dwconv7]
  local_ratios: [1.0, 1.0, 1.0, 1.0]
  channel_shuffle: [false, false, false, false]
  norm: bn
  stem_stride: 1
  drop_path_rate: 0.08
train:
  epochs: 300
  warmup_epochs: 5
  lr: 0.001
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  cutmix_prob: 0.5
  amp: true
  kd_alpha: 0.0
  kd_temperature: 4.0
