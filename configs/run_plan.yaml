  # ---- D series: CIFAR-100, a third dataset ------------------------------------------
  # Reported in the paper as a limitation rather than a headline dataset: at seed 42 the
  # comparison is the strongest cross-entropy evidence we have on any dataset
  # (+1.83 pp over ShuffleNetV2-x1.5, McNemar p=1.4e-07), which is the claim the paper
  # otherwise has to hedge.
  # Run order matters: D1 trains the teacher that D3 and D5 consume, and
  # find_teacher_checkpoint looks in the session's own output before --search-dir, so the
  # teacher must precede its students in the same session.
  #   session 1: D1 D3 D5      6.57 h   teacher s42, then both KD runs       [done]
  #   session 2: D2 D4         4.50 h   both CE runs s42, no teacher needed  [done]
  #   session 3: D6 D7 D8      6.13 h   rho sweep at seed 42                 [done]
  #   session 4: D19 D20 D21   6.25 h   rho sweep at seed 43                 [done]
  #   session 5: D9 D10 D11    6.57 h   teacher s43, then both KD runs
  #   session 6: D12 D13       4.50 h   both CE runs s43
  #   session 7: D14 D15 D16   6.57 h   teacher s44, then both KD runs
  #   session 8: D17 D18       4.50 h   both CE runs s44
  - {id: D1, dataset: cifar100, model: resnet18, seed: 42, answers: "CIFAR-100 teacher"}
  - {id: D2, dataset: cifar100, model: shufflenet_v2_x1_5, seed: 42, answers: "CIFAR-100 baseline CE"}
  - {id: D3, dataset: cifar100, model: shufflenet_v2_x1_5, seed: 42, kd_teacher: D1, answers: "CIFAR-100 baseline KD"}
  - {id: D4, dataset: cifar100, model: alllocal_2_68m_conv3x3_dw7, seed: 42, answers: "CIFAR-100 proposed CE"}
  - {id: D5, dataset: cifar100, model: alllocal_2_68m_conv3x3_dw7, seed: 42, kd_teacher: D1, answers: "CIFAR-100 proposed KD"}

  # The clustering ablation repeated on CIFAR-100: does the negative result hold on a
  # third dataset? These three are the rho sweep at fixed stem, folds, depth and width.
  - {id: D6, dataset: cifar100, model: hbcc_medium, seed: 42, answers: "CIFAR-100 hybrid rho=0.5"}
  - {id: D7, dataset: cifar100, model: allcluster_medium, seed: 42, answers: "CIFAR-100 rho=0, clustering only"}
  - {id: D8, dataset: cifar100, model: alllocal_macs_matched, seed: 42, answers: "CIFAR-100 rho=1, local only"}

  # Seeds 43 and 44 of the headline comparison. These are the remaining priority:
  # the comparison the paper reports is still at one seed on CIFAR-100, while the rho
  # sweep below is now at two and has answered its question. Sessions 5 to 8.
  - {id: D9,  dataset: cifar100, model: resnet18, seed: 43, conditional: true, answers: "CIFAR-100 teacher seed 43"}
  - {id: D10, dataset: cifar100, model: shufflenet_v2_x1_5, seed: 43, kd_teacher: D9, conditional: true, answers: "CIFAR-100 baseline KD seed 43"}
  - {id: D11, dataset: cifar100, model: alllocal_2_68m_conv3x3_dw7, seed: 43, kd_teacher: D9, conditional: true, answers: "CIFAR-100 proposed KD seed 43"}
  - {id: D12, dataset: cifar100, model: shufflenet_v2_x1_5, seed: 43, conditional: true, answers: "CIFAR-100 baseline CE seed 43"}
  - {id: D13, dataset: cifar100, model: alllocal_2_68m_conv3x3_dw7, seed: 43, conditional: true, answers: "CIFAR-100 proposed CE seed 43"}
  - {id: D14, dataset: cifar100, model: resnet18, seed: 44, conditional: true, answers: "CIFAR-100 teacher seed 44"}
  - {id: D15, dataset: cifar100, model: shufflenet_v2_x1_5, seed: 44, kd_teacher: D14, conditional: true, answers: "CIFAR-100 baseline KD seed 44"}
  - {id: D16, dataset: cifar100, model: alllocal_2_68m_conv3x3_dw7, seed: 44, kd_teacher: D14, conditional: true, answers: "CIFAR-100 proposed KD seed 44"}
  - {id: D17, dataset: cifar100, model: shufflenet_v2_x1_5, seed: 44, conditional: true, answers: "CIFAR-100 baseline CE seed 44"}
  - {id: D18, dataset: cifar100, model: alllocal_2_68m_conv3x3_dw7, seed: 44, conditional: true, answers: "CIFAR-100 proposed CE seed 44"}

  # Seeds 43 and 44 for the rho sweep itself. All cross-entropy, no teacher.
  #
  # D19-D21 ran (session 4) and settled this at two seeds. On test, CIFAR-100 CE:
  #   rho=0.5 hybrid      76.22  76.14  mean 76.18
  #   rho=0   clustering  75.56  75.90  mean 75.73   -0.45 vs hybrid (Tiny-ImageNet: -0.39)
  #   rho=1   local       76.48  76.04  mean 76.26   +0.08 vs hybrid (Tiny-ImageNet: +0.94)
  # Clustering's cost replicates; the local branch's gain does not. rho=1 vs rho=0 is
  # +0.53 pp on the means (+0.92 at s42, +0.14 at s43), Welch p=0.20.
  #
  # D22-D24 (seed 44) are SUPERSEDED and deliberately not run. Sweeping plausible
  # seed-44 outcomes, only 9 of 24 reach p<0.05, the best realistic case is p~0.025 on a
  # +0.5 pp margin, and rho=1 vs rho=0.5 stays a wash regardless. Two seeds already
  # support the sentence the paper needs: the direction replicates on a third dataset,
  # the magnitude does not. The hours went to D9-D18 instead.
  - {id: D19, dataset: cifar100, model: hbcc_medium, seed: 43, conditional: true, answers: "CIFAR-100 hybrid rho=0.5 seed 43"}
  - {id: D20, dataset: cifar100, model: allcluster_medium, seed: 43, conditional: true, answers: "CIFAR-100 rho=0 seed 43"}
  - {id: D21, dataset: cifar100, model: alllocal_macs_matched, seed: 43, conditional: true, answers: "CIFAR-100 rho=1 seed 43"}
  - {id: D22, dataset: cifar100, model: hbcc_medium, seed: 44, conditional: true, answers: "CIFAR-100 hybrid rho=0.5 seed 44"}
  - {id: D23, dataset: cifar100, model: allcluster_medium, seed: 44, conditional: true, answers: "CIFAR-100 rho=0 seed 44"}
  - {id: D24, dataset: cifar100, model: alllocal_macs_matched, seed: 44, conditional: true, answers: "CIFAR-100 rho=1 seed 44"}

  # ---- E series: does CoordConv account for the headline margin? ----------------------
  # Every HBCC-family config sets use_coord: true; the torchvision baselines take three input
  # channels. The headline comparison therefore confounds the coordinate channels with the
  # architecture, and no coord-off run exists among the 91 released runs. These six are that
  # run, at the final 2.71M configuration, on Tiny-ImageNet where the margin is largest.
  #
  # Decision rule, fixed before the runs: let delta = coord_off minus coord_on, KD, 3 seeds.
  #   delta >= -0.2 pp  -> keep CoordConv, report that it accounts for <= 0.2 of the 1.51 pp
  #                        margin. Dropping it would mean re-running the headline on both
  #                        datasets (12 runs, ~40 h) for no gain.
  #   -0.2 to -0.6 pp   -> keep, disclose with the measurement, and soften the headline to
  #                        "the design, including its coordinate channels".
  #   worse than -0.6   -> material. Cheapest repair is to give ShuffleNetV2-x1.5 the same
  #                        five-channel stem (3 KD runs, ~7.5 h), not to strip ours.
  #
  # The CE arm additionally lets the distillation gain be computed without CoordConv, which
  # tests a mechanism not among the three Section V lists. Teachers are the existing TIN
  # ResNet-18 runs: A2 (seed 42), A10 (seed 43), A18 (seed 44).
  # Split across two accounts: E1-E3 (CE, 8.4 h) on one, E4-E6 (KD, 9.6 h) on the other.
  - {id: E1, dataset: tin, model: alllocal_2_68m_conv3x3_dw7_coordoff, seed: 42, answers: "CoordConv off, CE seed 42"}
  - {id: E2, dataset: tin, model: alllocal_2_68m_conv3x3_dw7_coordoff, seed: 43, answers: "CoordConv off, CE seed 43"}
  - {id: E3, dataset: tin, model: alllocal_2_68m_conv3x3_dw7_coordoff, seed: 44, answers: "CoordConv off, CE seed 44"}
  - {id: E4, dataset: tin, model: alllocal_2_68m_conv3x3_dw7_coordoff, seed: 42, kd_teacher: A2, answers: "CoordConv off, KD seed 42"}
  - {id: E5, dataset: tin, model: alllocal_2_68m_conv3x3_dw7_coordoff, seed: 43, kd_teacher: A10, answers: "CoordConv off, KD seed 43"}
  - {id: E6, dataset: tin, model: alllocal_2_68m_conv3x3_dw7_coordoff, seed: 44, kd_teacher: A18, answers: "CoordConv off, KD seed 44"}

  # ---- F series: CONTINGENCY, only if the E series triggers branch (c) --------------
  # Branch (c) is coord_off minus coord_on worse than -0.6 pp on the KD headline, i.e. the
  # coordinate channels account for more than about 40% of the 1.51 pp margin. If that
  # happens the Table I comparison is confounded and must be repaired. Repairing it by
  # giving the baseline the same five-channel input is 3 runs; stripping the channels from
  # our model instead would mean re-running the headline on both datasets, 12 runs and
  # roughly 40 h, so this is the cheaper direction.
  #
  # Tiny-ImageNet only, KD only: that is where the margin is largest and where all three
  # seeds exist. CIFAR-10 is not re-run, and Section V would say so.
  #
  # Requires the code path in lightweight_hbcc/models/baselines.py (use_coord on the
  # ShuffleNetV2-x1.5 builder). SMOKE-TEST FIRST: run_queue.py --ids F1 --smoke takes about
  # two minutes and will catch a shape error before 8.6 h of GPU time is committed.
  # Teachers are the existing TIN ResNet-18 runs, as for the E series.
  - {id: F1, dataset: tin, model: shufflenet_v2_x1_5_coord, seed: 42, kd_teacher: A2, conditional: true, answers: "baseline + CoordConv, KD seed 42"}
  - {id: F2, dataset: tin, model: shufflenet_v2_x1_5_coord, seed: 43, kd_teacher: A10, conditional: true, answers: "baseline + CoordConv, KD seed 43"}
  - {id: F3, dataset: tin, model: shufflenet_v2_x1_5_coord, seed: 44, kd_teacher: A18, conditional: true, answers: "baseline + CoordConv, KD seed 44"}

